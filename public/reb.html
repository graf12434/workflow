          <div>
            <p class="eyebrow"><a href="./index.html" class="breadcrumb-link">Workflow</a> // Засоби РЕБ</p>
            <h1 id="pageTitle">Дального радіуса</h1>
          </div>
        </div>
        <div class="user-panel">
          <span id="connectionStatus" class="status-dot offline">Offline</span>
          <span id="userRole" class="role-badge">guest</span>
          <button id="backToJournalButton" class="ghost-button" type="button">До журналу</button>
          <button id="logoutButton" class="ghost-button" type="button" hidden>Вийти</button>
        </div>
      </header>

      <main>
        <section id="rebFarView" hidden>
          <section class="work-grid">
            <form id="entryForm" class="panel entry-form">
              <div class="section-head">
                <div>
                  <p class="eyebrow">new asset</p>
                  <h2>Додати засіб</h2>
                </div>
                <button id="resetFormButton" class="ghost-button" type="button">Очистити</button>
              </div>

              <input id="recordId" type="hidden" />
              <label class="wide">
                Назва
                <select id="name" required>
                  <option value="" disabled selected>Оберіть назву</option>
                </select>
              </label>
              <label>
                Серійний №
                <input id="serialNumber" type="text" required />
              </label>
              <label>
                Належність
                <select id="ownership" required>
                  <option value="company">Майно роти</option>
                  <option value="regiment">Майно полка</option>
                </select>
              </label>
              <label class="wide">
                Стан
                <select id="status" required>
                  <option value="ready">Боєготовий</option>
                  <option value="not_ready">Небоєготовий</option>
                  <option value="repair">Ремонт</option>
                  <option value="destroyed">Знищений</option>
                </select>
              </label>
              <label class="wide">
                Примітка
                <textarea id="note" rows="4" placeholder="Коротко про стан, місце зберігання тощо"></textarea>
              </label>
              <button id="saveButton" class="primary-button wide" type="submit">Зберегти засіб</button>
              <p id="formMessage" class="message wide"></p>
            </form>

            <section class="panel operations-panel">
              <div class="section-head">
                <div>
                  <p class="eyebrow">records</p>
                  <h2 id="recordsTitle">Засоби дального радіуса</h2>
                </div>
                <select id="typeSwitcher" aria-label="Тип засобів РЕБ">
                  <option value="long">Дального радіуса</option>
                  <option value="medium">Ближнього радіуса</option>
                  <option value="dome">Купольні</option>
                </select>
              </div>

              <div class="filters">
                <select id="nameFilter">
                  <option value="">Усі назви</option>
                </select>

                <select id="ownershipFilter" aria-label="Належність">
                  <option value="all">Обидва</option>
                  <option value="company">Майно роти</option>
                  <option value="regiment">Майно полка</option>
                </select>

                <select id="statusFilter" aria-label="Стан">
                  <option value="all">Всі</option>
                  <option value="ready">Боєготовий</option>
                  <option value="not_ready">Небоєготовий</option>
                  <option value="repair">Ремонт</option>
                  <option value="destroyed">Знищений</option>
                </select>
              </div>

              <div class="intel-strip">
                <div>
                  <span>У фільтрі</span>
                  <strong id="filteredTotal">0</strong>
                </div>
              </div>

              <div class="table-wrap table-wrap-compact">
                <table>
                  <thead>
                    <tr>
                      <th>Назва</th>
                      <th>Серійний №</th>
                      <th>Належність</th>
                      <th>Стан</th>
                      <th>Примітка</th>
                      <th class="admin-only">Керування</th>
                    </tr>
                  </thead>
                  <tbody id="recordsBody">
                    <tr>
                      <td colspan="6" class="empty-state">Немає записів</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>
          </section>
        </section>

        <section id="noAccessView" class="panel compact-form" hidden>
          <p class="message" id="noAccessMessage">Увійдіть у систему, щоб переглянути цю сторінку.</p>
        </section>
      </main>
    </div>

    <script src="./supabase-config.js?v=20260831-6"></script>
    <script src="./reb.js?v=20260831-7"></script>
