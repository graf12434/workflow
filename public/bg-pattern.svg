<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <g fill="none" stroke="#c1b36b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.1">
    <!-- antenna -->
    <g transform="translate(40,70)">
      <line x1="0" y1="0" x2="0" y2="70" />
      <line x1="-14" y1="70" x2="14" y2="70" />
      <path d="M -18 -6 A 26 26 0 0 1 18 -6" />
      <path d="M -30 -18 A 44 44 0 0 1 30 -18" />
      <circle cx="0" cy="-6" r="3" fill="#c1b36b" stroke="none" />
    </g>

    <!-- resistor -->
    <g transform="translate(285,50)">
      <line x1="-40" y1="0" x2="-24" y2="0" />
      <path d="M -24 0 L -18 -10 L -10 10 L -2 -10 L 6 10 L 14 -10 L 20 0" />
      <line x1="20" y1="0" x2="40" y2="0" />
    </g>

    <!-- capacitor -->
    <g transform="translate(90,195)">
      <line x1="-30" y1="0" x2="-6" y2="0" />
      <line x1="-6" y1="-18" x2="-6" y2="18" />
      <line x1="6" y1="-18" x2="6" y2="18" />
      <line x1="6" y1="0" x2="30" y2="0" />
    </g>

    <!-- IC chip -->
    <g transform="translate(215,175)">
      <rect x="-30" y="-20" width="60" height="40" />
      <line x1="-30" y1="-12" x2="-42" y2="-12" />
      <line x1="-30" y1="0" x2="-42" y2="0" />
      <line x1="-30" y1="12" x2="-42" y2="12" />
      <line x1="30" y1="-12" x2="42" y2="-12" />
      <line x1="30" y1="0" x2="42" y2="0" />
      <line x1="30" y1="12" x2="42" y2="12" />
      <circle cx="-20" cy="-12" r="2" fill="#c1b36b" stroke="none" />
    </g>

    <!-- radio waves -->
    <g transform="translate(345,150)">
      <circle cx="0" cy="0" r="2.5" fill="#c1b36b" stroke="none" />
      <path d="M 10 0 A 10 10 0 0 1 0 10" />
      <path d="M 20 0 A 20 20 0 0 1 0 20" />
      <path d="M 30 0 A 30 30 0 0 1 0 30" />
    </g>

    <!-- satellite dish -->
    <g transform="translate(60,325)">
      <path d="M -34 10 A 36 20 0 0 1 34 10" />
      <line x1="0" y1="-8" x2="0" y2="10" />
      <circle cx="0" cy="-8" r="2.5" fill="#c1b36b" stroke="none" />
      <line x1="0" y1="10" x2="0" y2="30" />
      <line x1="-10" y1="30" x2="10" y2="30" />
    </g>

    <!-- transistor -->
    <g transform="translate(205,345)">
      <circle cx="0" cy="0" r="16" />
      <line x1="-16" y1="0" x2="-30" y2="0" />
      <line x1="6" y1="-8" x2="20" y2="-20" />
      <line x1="6" y1="8" x2="20" y2="20" />
      <line x1="-4" y1="-10" x2="-4" y2="10" />
    </g>

    <!-- inductor coil -->
    <g transform="translate(345,300)">
      <path d="M -30 0 a 7 7 0 0 1 14 0 a 7 7 0 0 1 14 0 a 7 7 0 0 1 14 0" />
      <line x1="-40" y1="0" x2="-30" y2="0" />
      <line x1="12" y1="0" x2="22" y2="0" />
    </g>

    <!-- PCB traces -->
    <path d="M 130 65 L 130 105 L 170 105 L 170 140" />
    <circle cx="130" cy="105" r="2.5" fill="#c1b36b" stroke="none" />
    <circle cx="170" cy="140" r="2.5" fill="#c1b36b" stroke="none" />

    <path d="M 260 225 L 300 225 L 300 265 L 340 265" />
    <circle cx="300" cy="225" r="2.5" fill="#c1b36b" stroke="none" />

    <!-- small resistor -->
    <g transform="translate(300,385)">
      <line x1="-30" y1="0" x2="-14" y2="0" />
      <path d="M -14 0 L -8 -8 L 0 8 L 8 -8 L 16 0" />
      <line x1="16" y1="0" x2="30" y2="0" />
    </g>
  </g>
</svg>
